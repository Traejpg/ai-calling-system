# Render Blueprint for AI Calling System
# Deploy this to Render.com for permanent hosting
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ai-calling-system
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    # Health check path
    healthCheckPath: /health
    # Auto-deploy on git push
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      # Twilio Configuration
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # ElevenLabs Configuration
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: ELEVENLABS_PHONE_NUMBER_ID
        sync: false
      # Deepgram Configuration
      - key: DEEPGRAM_API_KEY
        sync: false
      # Notion Configuration
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: NOTION_CALLS_DB_ID
        sync: false
      # SMS Alerts
      - key: SMS_ALERT_NUMBER
        sync: false
