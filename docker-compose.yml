version: '3.8'

services:
  ai-calling-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-calling-system
    restart: unless-stopped
    
    # Environment variables from .env file
    env_file:
      - .env
    
    # Or define directly
    environment:
      - NODE_ENV=production
      - PORT=3000
    
    # Port mapping
    ports:
      - "3000:3000"
    
    # Persistent volumes
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Redis for caching/session storage
  # redis:
